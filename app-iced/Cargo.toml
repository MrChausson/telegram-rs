[package]
name = "app-iced"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "telegram-rs"
path = "src/main.rs"

[lib]
name = "app_iced"
path = "src/lib.rs"

[dependencies]
iced.workspace = true
tg = { path = "../tg" }
grammers-client = { git = "https://github.com/Lonami/grammers" }
grammers-session = { git = "https://github.com/Lonami/grammers" }
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "time", "io-util", "fs"] }
anyhow = "1"
mimalloc.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "alloc"] }
tiny-skia.workspace = true
image-codec = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Native file picker for the attach 📎 button (xdg-desktop-portal on Linux).
rfd = "0.15"
# In-app voice-note playback (rodio decodes the downloaded audio files).
# NOTE: Telegram voices are Opus-in-Ogg and neither rodio nor symphonia ship
# an Opus decoder — downloads are transcoded to WAV via system ffmpeg
# (see `tg::client::download_document`) before playback.
rodio = { version = "0.19", default-features = false, features = ["flac", "vorbis", "wav", "mp3", "symphonia-all"] }
# Desktop notifications for incoming messages in non-open chats (Wayland-safe
# via libdbus / xdg-desktop-portal).
notify-rust = "4"
# System tray (StatusNotifier on Wayland/X11, no GTK): open/quit from the icon.
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

# Perf regression harness: `cargo bench -p app-iced` builds the real view
# headlessly (lib target) and measures build/layout/raster time vs message count.
[dev-dependencies]
criterion = "0.5"
iced_core = "0.14"
iced_tiny_skia = "0.14"
bytemuck = "1"

[[bench]]
name = "frame"
path = "benches/frame.rs"
harness = false
