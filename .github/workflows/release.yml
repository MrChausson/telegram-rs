name: Release

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver bump to apply"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: System dependencies (winit / iced tiny-skia / alsa for rodio)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxext-dev \
            libasound2-dev

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Bump version and rotate changelog
        id: bump
        run: |
          NEXT=$(python3 scripts/release-bump.py "${{ inputs.semver }}")
          echo "VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "TAG=v$NEXT" >> "$GITHUB_ENV"
          echo "TAG=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Guard against existing tag
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping. Double-check the last release." >&2
            exit 1
          fi

      - name: Refresh Cargo.lock
        run: cargo check --workspace --all-targets

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Bump version to v$VERSION"
          git tag -a "$TAG" -m "Telegram RS $TAG"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main "$TAG"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-linux:
    needs: bump-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies (winit / iced tiny-skia / alsa for rodio)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxext-dev \
            libasound2-dev \
            imagemagick fonts-dejavu-core

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release

      - name: Tests
        run: cargo test --workspace

      - name: Tarball Linux
        run: |
          mkdir -p dist
          cp target/release/telegram-rs dist/telegram-rs
          tar -C dist -czf dist/telegram-rs-linux-$(uname -m).tar.gz telegram-rs
          cp install.sh dist/install.sh
          chmod +x dist/install.sh

      - name: AppImage - AppDir layout
        run: |
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp target/release/telegram-rs AppDir/usr/bin/telegram-rs
          # AppImage runtime entry point (required for the image to launch)
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF="$(dirname "$(readlink -f "$0")")"
          exec "$SELF/usr/bin/telegram-rs" "$@"
          EOF
          chmod +x AppDir/AppRun
          # Icon (PNG) + menu entry
          # App logo (accent disc + white send-plane) — same geometry as
          # assets/icon.svg / app-iced/src/icons.rs Icon::Logo, scaled 2x.
          convert -size 256x256 xc:none -fill '#3390ec' \
            -draw 'circle 128,128 128,0' -fill white \
            -draw 'polygon 64.4,187.5 203.3,128 64.4,68.5 64.4,114.8 157,128 64.4,161.2' \
            AppDir/telegram-rs.png
          cat > AppDir/telegram-rs.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Telegram RS
          Comment=Minimal Telegram client in Rust
          Exec=AppRun
          Icon=telegram-rs
          Terminal=false
          Categories=Network;Chat;
          EOF

      - name: AppImage - build the image
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run AppDir dist/telegram-rs-x86_64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-rs-linux
          path: dist/
          if-no-files-found: error

  build-macos:
    needs: bump-tag
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release, Intel)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build (release, Apple Silicon)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release --target aarch64-apple-darwin

      - name: Bundle universal binary and tarball
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/telegram-rs \
            target/aarch64-apple-darwin/release/telegram-rs \
            -output dist/telegram-rs
          tar -C dist -czf dist/telegram-rs-macos-universal.tar.gz telegram-rs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-rs-macos
          path: dist/
          if-no-files-found: error

  build-windows:
    needs: bump-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release

      - name: Zip the binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pkg | Out-Null
          Copy-Item target/release/telegram-rs.exe pkg/telegram-rs.exe
          Compress-Archive -Path pkg/telegram-rs.exe -DestinationPath dist/telegram-rs-windows-x86_64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-rs-windows
          path: dist/
          if-no-files-found: error

  publish:
    needs: [bump-tag, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: telegram-rs-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-tag.outputs.tag }}
          name: ${{ needs.bump-tag.outputs.tag }}
          target_commitish: main
          body_path: dist/release-notes.md
          files: dist/*

  # Publish the prebuilt binary to the AUR (telegram-rs-bin).
  #
  # Kept AFTER `publish`'s GitHub Release: the PKGBUILD's source= pulls the
  # tarball from the release download URL, and updpkgsums fetches it to
  # recompute the sha256 — so the release assets must already be live.
  # (The legacy tag-triggered .github/workflows/aur.yml had a latent race:
  # tags are pushed in bump-tag, *before* the release is created.)
  aur-publish:
    needs: [bump-tag, publish]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tooling (git, updpkgsums, ssh, sudo)
        run: pacman -Sy --noconfirm git pacman-contrib openssh sudo

      - name: Checkout (released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-tag.outputs.tag }}

      - name: Resolve version (from tag output)
        run: |
          VERSION="${{ needs.bump-tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing telegram-rs-bin ${VERSION}"

      - name: Prepare unprivileged builder (makepkg refuses root)
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          chown -R builder:builder /home/builder

      - name: Configure SSH (AUR deploy key)
        run: |
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key
          chown builder:builder /home/builder/.ssh/aur_key
          # Official AUR host key (obtained via https://aur.archlinux.org/ssh).
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" >> /home/builder/.ssh/known_hosts
          printf "Host aur.archlinux.org\n  IdentityFile /home/builder/.ssh/aur_key\n  User aur\n" >> /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/known_hosts /home/builder/.ssh/config

      - name: Clone AUR package
        run: |
          sudo -u builder git clone --quiet \
            ssh://aur@aur.archlinux.org/telegram-rs-bin.git /home/builder/pkg \
          || {
            # First publish ever: the repo only materialises on first push.
            mkdir -p /home/builder/pkg
            cd /home/builder/pkg
            sudo -u builder git init -b master
            sudo -u builder git remote add origin ssh://aur@aur.archlinux.org/telegram-rs-bin.git
          }

      - name: Sync PKGBUILD with this release
        run: |
          cd /home/builder/pkg
          sudo -u builder cp \
            "${GITHUB_WORKSPACE}/dist/aur/PKGBUILD" \
            "${GITHUB_WORKSPACE}/dist/aur/telegram-rs.desktop" \
            "${GITHUB_WORKSPACE}/dist/aur/telegram-rs.svg" .
          sudo -u builder sed -i "s/^pkgver=.*/pkgver=${VERSION}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Recompute every sha256 (tarball + LICENSE move with the tag).
          sudo -u builder bash -c "cd /home/builder/pkg && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          # updpkgsums leaves downloaded sources in the repo dir; committing
          # them trips the AUR's 500 KiB blob hook (the tarball lives on
          # GitHub — the AUR fetches it at build time via the source= URL).
          sudo -u builder rm -f *.tar.gz

      - name: Commit & push (only when changed)
        run: |
          cd /home/builder/pkg
          sudo -u builder git config user.name "AUR Publish Bot"
          sudo -u builder git config user.email "bot@users.noreply.github.com"
          sudo -u builder git add -A
          if sudo -u builder git diff --cached --quiet; then
            echo "## ⏭️ AUR already at ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo -u builder git commit -m "upgpkg: ${VERSION}"
          sudo -u builder git push origin master
          echo "## ✅ AUR telegram-rs-bin updated to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"