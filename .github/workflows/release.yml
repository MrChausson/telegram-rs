name: Release

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver bump to apply"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: System dependencies (winit / softbuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxext-dev

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Bump version and rotate changelog
        id: bump
        run: |
          NEXT=$(python3 scripts/release-bump.py "${{ inputs.semver }}")
          echo "VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "TAG=v$NEXT" >> "$GITHUB_ENV"
          echo "TAG=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Guard against existing tag
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping. Double-check the last release." >&2
            exit 1
          fi

      - name: Refresh Cargo.lock
        run: cargo check --workspace --all-targets

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Bump version to v$VERSION"
          git tag -a "$TAG" -m "tg $TAG"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main "$TAG"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-linux:
    needs: bump-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies (winit / softbuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxext-dev \
            imagemagick fonts-dejavu-core

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release

      - name: Tests
        run: cargo test --workspace

      - name: Tarball Linux
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/tg-linux-$(uname -m).tar.gz app
          cp install.sh dist/install.sh
          chmod +x dist/install.sh

      - name: AppImage - AppDir layout
        run: |
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp target/release/app AppDir/usr/bin/tg
          # AppImage runtime entry point (required for the image to launch)
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF="$(dirname "$(readlink -f "$0")")"
          exec "$SELF/usr/bin/tg" "$@"
          EOF
          chmod +x AppDir/AppRun
          # Icon (PNG) + menu entry
          convert -size 256x256 xc:'#1e1f22' -fill '#32a852' \
            -font DejaVu-Sans-Bold -pointsize 140 -gravity center \
            -annotate 0 'tg' AppDir/tg.png
          cat > AppDir/tg.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=tg
          Comment=Minimal Telegram client in Rust
          Exec=AppRun
          Icon=tg
          Terminal=false
          Categories=Network;Chat;
          EOF

      - name: AppImage - build the image
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run AppDir dist/tg-x86_64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-linux
          path: dist/
          if-no-files-found: error

  build-macos:
    needs: bump-tag
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release, Intel)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build (release, Apple Silicon)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release --target aarch64-apple-darwin

      - name: Bundle universal binary and tarball
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/app \
            target/aarch64-apple-darwin/release/app \
            -output dist/tg
          tar -C dist -czf dist/tg-macos-universal.tar.gz tg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-macos
          path: dist/
          if-no-files-found: error

  build-windows:
    needs: bump-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release

      - name: Zip the binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pkg | Out-Null
          Copy-Item target/release/app.exe pkg/tg.exe
          Compress-Archive -Path pkg/tg.exe -DestinationPath dist/tg-windows-x86_64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-windows
          path: dist/
          if-no-files-found: error

  publish:
    needs: [bump-tag, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tg-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-tag.outputs.tag }}
          name: ${{ needs.bump-tag.outputs.tag }}
          target_commitish: main
          body_path: dist/release-notes.md
          files: dist/*