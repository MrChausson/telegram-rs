[workspace]
resolver = "2"
members = ["tg", "app-iced"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tiny-skia = "0.11"
mimalloc = "0.1"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "image", "canvas", "tokio"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# core2 0.4.0 (required by glass_pumpkin/grammers-crypto) is yanked on
# crates.io; we provide it from a local, non-yanked archive.
[patch.crates-io]
core2 = { path = "vendor/core2-0.4.0" }